name: Publish landing page

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "apps/landing/**"
      - "apps/admin/**"
      # The LP bundles a manual-install (sideload) zip of the extension as a download fallback —
      # while Chrome Web Store review is pending, that zip is the only real distribution channel,
      # so an extension-only change (no apps/landing/apps/admin touched) must still redeploy it.
      - "apps/extension/**"
      - "scripts/package-extension-sideload.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/landing-pages.yml"
      - "firebase.json"

permissions:
  contents: read

concurrency:
  group: firebase-hosting
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck -w @qts/landing
      - run: npm run test -w @qts/landing
      - run: npm run typecheck -w @qts/admin
      - run: npm run test -w @qts/admin
      - name: Require browser-safe backend configuration
        run: |
          test -n "$VITE_SUPABASE_URL"
          test -n "$VITE_SUPABASE_PUBLISHABLE_KEY"
          case "$VITE_SUPABASE_URL" in https://*.supabase.co) ;; *) exit 1 ;; esac
      - name: Build landing for Firebase Hosting (site at the root)
        run: npm run build -w @qts/landing -- --base "/"
      - name: Build founder admin under /admin of the same site
        run: npm run build -w @qts/admin -- --base "/admin/"
      - name: Add founder admin to the landing artifact
        run: |
          mkdir -p apps/landing/dist/admin
          cp -R apps/admin/dist/. apps/landing/dist/admin/
      - name: Package the manual-install (sideload) extension zip for the download fallback
        run: npm run package:extension:sideload -- --output=apps/landing/dist/qa-toolbar-sandbox-extension.zip
      # SPA routing (deep links, /admin/**) is handled by the rewrites in firebase.json.
      - name: Check for the Firebase deploy credential
        id: credential
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_QATOOLBARSANDBOX }}
        run: |
          if [ -n "$FIREBASE_SERVICE_ACCOUNT" ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else
            echo "::warning::FIREBASE_SERVICE_ACCOUNT_QATOOLBARSANDBOX is not set: built and checked, but not deployed. Deploy by hand with npm run deploy:firebase."
            echo "present=false" >> "$GITHUB_OUTPUT"; fi
      # Moved from GitHub Pages to Firebase Hosting on 2026-10-22 (the repository goes private, and
      # Pages on private repositories needs a paid plan). https://qatoolbarsandbox.web.app
      - name: Deploy to Firebase Hosting
        if: steps.credential.outputs.present == 'true'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_QATOOLBARSANDBOX }}
          projectId: qatoolbarsandbox
          channelId: live
