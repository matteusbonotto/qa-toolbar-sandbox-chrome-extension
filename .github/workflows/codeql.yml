name: CodeQL

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    - cron: "23 6 * * 1"

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    # Code scanning on a PRIVATE repository needs GitHub Advanced Security (paid). Skip instead of
    # failing every PR once the repository is private; it runs as before while public.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          queries: security-extended
      - uses: github/codeql-action/analyze@v4
