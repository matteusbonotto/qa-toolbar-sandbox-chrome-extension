name: Quality

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Reject secrets and private artifacts before installing dependencies
        run: node scripts/check-repository.mjs && node scripts/check-extension-bundle.mjs
      - name: Require a version bump whenever apps/extension/ changes
        run: node scripts/check-extension-version-bump.mjs
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Playwright's Chromium (needed by scripts/test-gif-encoder.mjs, part of npm test)
        # --with-deps runs apt-get, which has hung on the runner for 10+ minutes when a mirror stalls
        # (3 runs on 2026-10-23). 240s per attempt is ~4x a normal install; retry instead of waiting.
        run: |
          for attempt in 1 2 3; do
            timeout 240 npx playwright install --with-deps chromium && exit 0
            echo "Playwright install attempt $attempt timed out or failed, retrying"
          done
          exit 1
      - run: npm run typecheck
      - run: npm run test
      - name: Build isolated extension test package
        run: npm run package:extension:test
      - run: npm audit --omit=dev --audit-level=critical
      - name: Record full development-tool audit
        continue-on-error: true
        run: npm audit --audit-level=high
